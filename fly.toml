# Fly.io: container host for the subscription-backed coach (Agent SDK binary is too big for Vercel).
app = "robert-workout-tracker"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
